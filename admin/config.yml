# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: dropkick7/quitnursing-site
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/37c93c6b-70e5-47ce-993c-070f8b699782/pkce
  auth_token_endpoint: /sites/37c93c6b-70e5-47ce-993c-070f8b699782/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://papaya-bunny-9f2288.netlify.app

# This makes the "Publish" button in the admin UI actually
# create a commit that Netlify then builds and deploys.
publish_mode: simple

media_folder: "src/static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "src/blog/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false, hint: "One or two sentences shown on the blog index. Optional — auto-generated from the post if left blank." }
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Shows full-width at the top of the post and as a thumbnail on the blog list. Optional." }
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: ["posts"]
        hint: "Keep 'posts' as the first tag — it's required for the post to show up in the blog list."
      - { label: "Body", name: "body", widget: "markdown" }
    editor:
      preview: true
